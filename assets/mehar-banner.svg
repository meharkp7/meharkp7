<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFF1F7"/>
    <stop offset="0.48" stop-color="#F3E9FA"/>
    <stop offset="1" stop-color="#E8F6F3"/>
  </linearGradient>
  <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 60) rotate(35) scale(260 180)">
    <stop stop-color="#FFD1E3" stop-opacity=".75"/>
    <stop offset="1" stop-color="#FFD1E3" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 240) rotate(215) scale(300 190)">
    <stop stop-color="#C9E8E2" stop-opacity=".8"/>
    <stop offset="1" stop-color="#C9E8E2" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#B78AA0" flood-opacity=".12"/>
  </filter>
</defs>

<rect width="1200" height="300" rx="34" fill="url(#bg)"/>
<rect width="1200" height="300" rx="34" fill="url(#glow1)"/>
<rect width="1200" height="300" rx="34" fill="url(#glow2)"/>

<!-- soft decorative blobs -->
<circle cx="92" cy="210" r="42" fill="#E8A0BF" fill-opacity=".15"/>
<circle cx="1120" cy="82" r="52" fill="#CDB4DB" fill-opacity=".18"/>
<circle cx="1015" cy="55" r="18" fill="#A8DADC" fill-opacity=".45"/>
<circle cx="205" cy="58" r="14" fill="#FFD6E7" fill-opacity=".8"/>

<!-- stars -->
<g fill="#C08497" fill-opacity=".72">
  <path d="M108 83l4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10Z"/>
  <path d="M1070 177l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8Z"/>
  <path d="M1018 113l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6Z"/>
</g>

<!-- tiny flowers -->
<g stroke="#C08497" stroke-width="2" stroke-linecap="round" opacity=".65">
  <path d="M146 236c8-13 18-17 29-18"/>
  <path d="M1050 225c-7-12-17-16-27-17"/>
</g>
<g fill="#E8A0BF" opacity=".75">
  <circle cx="142" cy="238" r="4"/><circle cx="151" cy="231" r="4"/><circle cx="160" cy="237" r="4"/>
  <circle cx="1048" cy="227" r="4"/><circle cx="1057" cy="220" r="4"/><circle cx="1066" cy="227" r="4"/>
</g>

<!-- center glass card -->
<rect x="245" y="54" width="710" height="192" rx="32" fill="#FFFFFF" fill-opacity=".58" stroke="#FFFFFF" stroke-opacity=".78" filter="url(#shadow)"/>

<text x="600" y="122" text-anchor="middle"
      font-family="Trebuchet MS, Arial, sans-serif"
      font-size="50" font-weight="700" letter-spacing="2"
      fill="#8F6277">MEHAR KAPOOR</text>

<text x="600" y="161" text-anchor="middle"
      font-family="Trebuchet MS, Arial, sans-serif"
      font-size="18" letter-spacing="3"
      fill="#B17891">AI  ·  ML  ·  INTELLIGENT SYSTEMS</text>

<line x1="455" y1="187" x2="745" y2="187" stroke="#D9B2C4" stroke-width="1.5"/>

<text x="600" y="216" text-anchor="middle"
      font-family="Trebuchet MS, Arial, sans-serif"
      font-size="15" letter-spacing="1"
      fill="#7D7880">building curious things with code ✦</text>

<!-- little sparkle -->
<text x="276" y="89" font-family="Arial, sans-serif" font-size="23" fill="#C08497">✦</text>
<text x="919" y="220" font-family="Arial, sans-serif" font-size="21" fill="#C08497">♡</text>
</svg>